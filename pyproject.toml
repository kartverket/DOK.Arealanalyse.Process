[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dokanalyse"
description = "Arealanalyse av DOK-datasett"
version = "0.1.8"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygeoapi",
    "asyncio",
    "aiohttp",
    "aiofiles",
    "async-lru",
    "pydantic>=2.0",
    "jsonschema",
    "pydash",
    "geopandas",
    "matplotlib",
    "cartopy",
    "scipy",
    "OWSLib",
    "pyproj",
    "contextily",
    "Pillow",
    "weasyprint",
    "Markdown",
    "python-socketio[client]",
    "azure-storage-blob",
    "lxml",
    "types-lxml",
    "shapely",
    "PyYAML",
    "structlog>=25.5.0",
    "xmltodict>=1.0.4",
    "pygeofilter>=0.3.3",
    "xmlschema>=4.3.1",
    "filelock>=3.20.3",
    "typer>=0.24.1",
    "jinja2>=3.1.6",
    "babel>=2.18.0",
    "python-dateutil>=2.9.0.post0",
]

[project.scripts]
build-dokanalyse-cache = "dokanalyse.caching.cli:main"

[tool.setuptools.package-data]
dokanalyse = [
    "**/*.json",
    "**/*.txt",
    "**/*.jinja",
    "**/*.css",
    "**/*.svg",
    "**/*.ttf",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.setuptools]
license-files = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]
